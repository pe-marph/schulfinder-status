# Uptime monitor for SchulFinder Wien (schulfinder.wien), PE Marph GmbH.
# Upptime, open source (MIT), runs on GitHub Actions in this public repository:
# checks every 5 minutes (Upptime's default schedule), opens an issue when a site is down
# and closes it when it is back. Set up 3 November 2026 (register F109).
owner: pe-marph
repo: schulfinder-status

sites:
  - name: SchulFinder Wien
    url: https://schulfinder.wien
  - name: SchulFinder Wien – Schulen
    url: https://schulfinder.wien/de/schulen

status-website:
  # No custom domain: served on GitHub Pages under the repository name.
  baseUrl: /schulfinder-status
  name: SchulFinder Wien – status
  introTitle: "Status of schulfinder.wien"
  introMessage: Checked every five minutes from GitHub Actions.
  navbar:
    - title: Status
      href: /
    - title: SchulFinder Wien
      href: https://schulfinder.wien

# Configuration reference: https://upptime.js.org/docs/configuration
